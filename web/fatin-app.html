<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فطن | منصة تعليمية ذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --ink:#15323a; --muted:#5b7079;
    --primary:#0e8f86; --primary-d:#0a6e67; --primary-l:#e6f5f3;
    --accent:#5b6ee1; --accent-l:#eceeffd9; --warn:#e7913b; --warn-l:#fdf0e0;
    --danger:#df5a5a; --danger-l:#fde9e9; --ok:#3aa76d; --ok-l:#e6f5ec;
    --line:#e6ecee; --shadow:0 6px 24px rgba(20,50,58,.07);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);direction:rtl}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .sidebar{width:248px;background:var(--surface);border-left:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:800;font-size:22px}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));
    display:grid;place-items:center;color:#fff;font-weight:800}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:var(--muted);
    font-weight:500;font-size:15px;margin-bottom:3px;transition:.15s;width:100%;text-align:right}
  .nav-item:hover{background:var(--primary-l);color:var(--primary-d)}
  .nav-item.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
  .nav-item .ico{width:20px;height:20px;flex-shrink:0}
  .nav-sep{font-size:11px;color:#9fb0b6;font-weight:700;margin:14px 10px 6px}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
  .search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--bg);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:var(--muted)}
  .search input{border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--ink)}
  .top-actions{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
  .icon-btn{width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;
    color:var(--muted);position:relative}
  .icon-btn:hover{background:var(--primary-l);color:var(--primary-d)}
  .badge-dot{position:absolute;top:8px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
  .avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--primary));
    color:#fff;display:grid;place-items:center;font-weight:700}
  .content{padding:26px;flex:1;overflow:auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
  .page-head h1{font-size:24px;font-weight:800}
  .page-head p{color:var(--muted);margin-top:4px;font-size:14px}
  /* Cards */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .kpi{display:flex;flex-direction:column;gap:8px}
  .kpi .row{display:flex;align-items:center;justify-content:space-between}
  .kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
  .kpi .val{font-size:28px;font-weight:800;line-height:1}
  .kpi .lbl{color:var(--muted);font-size:14px;font-weight:500}
  .kpi .chg{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
  .up{background:var(--ok-l);color:var(--ok)} .down{background:var(--danger-l);color:var(--danger)}
  .card-title{font-weight:700;font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
  .pill.ai{background:var(--accent-l);color:var(--accent)}
  /* Bars chart */
  .bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .bar{width:60%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--primary),var(--primary-d));transition:.4s}
  .bar.alt{background:linear-gradient(180deg,var(--accent),#4655c9)}
  .bar-lbl{font-size:12px;color:var(--muted);font-weight:500}
  /* Donut */
  .donut-wrap{display:flex;align-items:center;gap:20px}
  .legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
  .legend .li{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .legend .sw{width:11px;height:11px;border-radius:3px}
  /* Table */
  table{width:100%;border-collapse:collapse}
  th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:13px 12px;font-size:14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block}
  .mini-av{width:32px;height:32px;border-radius:9px;background:var(--primary-l);color:var(--primary-d);
    display:inline-grid;place-items:center;font-weight:700;font-size:13px;margin-left:8px;vertical-align:middle}
  .btn{background:var(--primary);color:#fff;padding:10px 18px;border-radius:11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:var(--primary-d)} .btn.ghost{background:var(--primary-l);color:var(--primary-d)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
  .progress>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--accent))}
  /* Login */
  .login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
  .login .hero{background:linear-gradient(150deg,var(--primary-d),var(--accent));color:#fff;
    padding:60px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
  .login .hero h1{font-size:42px;font-weight:800;line-height:1.2}
  .login .hero p{font-size:18px;opacity:.92;max-width:420px;line-height:1.8}
  .hero .feat{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.13);
    padding:13px 16px;border-radius:14px;backdrop-filter:blur(4px);font-weight:500}
  .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .login .form{display:flex;align-items:center;justify-content:center;padding:40px}
  .form-box{width:100%;max-width:380px}
  .form-box h2{font-size:26px;font-weight:800;margin-bottom:6px}
  .form-box .sub{color:var(--muted);margin-bottom:26px}
  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:5px;margin-bottom:20px}
  .tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
  .tabs button.on{background:var(--surface);color:var(--primary-d);box-shadow:var(--shadow)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    font-family:inherit;font-size:14px;outline:none;background:var(--surface)}
  .field input:focus{border-color:var(--primary)}
  .role-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .role-pick button{padding:11px 6px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;
    font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
  .role-pick button.on{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}
  /* Lesson */
  .lesson-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .lesson-tabs button{padding:9px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
    font-weight:700;font-size:13px;color:var(--muted)}
  .lesson-tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .ai-box{background:linear-gradient(135deg,var(--accent-l),var(--primary-l));border:1px solid var(--line);
    border-radius:14px;padding:18px;line-height:2;font-size:15px}
  .chat{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow:auto;padding:4px}
  .msg{max-width:78%;padding:12px 15px;border-radius:14px;font-size:14px;line-height:1.8}
  .msg.user{background:var(--primary);color:#fff;align-self:flex-start;border-bottom-right-radius:4px}
  .msg.bot{background:var(--bg);align-self:flex-end;border-bottom-left-radius:4px}
  .chat-input{display:flex;gap:8px;margin-top:14px}
  .chat-input input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;outline:none}
  .lib-card{position:relative;overflow:hidden}
  .lib-cover{height:84px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center;color:#fff;font-size:30px}
  .soft{color:var(--muted);font-size:13px}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .roundico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
  @media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){
    .sidebar{position:fixed;right:-260px;z-index:50;transition:.25s;box-shadow:var(--shadow)}
    .sidebar.open{right:0}
    .menu-btn{display:grid!important}
    .login{grid-template-columns:1fr}.login .hero{display:none}
    .g2,.g3,.g4{grid-template-columns:1fr}
  }
  .menu-btn{display:none}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
  .overlay.show{display:block}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* ---------- tiny inline icons ---------- */
const I = ({d,s=20})=>(<svg className="ico" width={s} height={s} viewBox="0 0 24 24" fill="none"
  stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>);
const Ico = {
  dash:<I d={<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></>}/>,
  users:<I d={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></>}/>,
  book:<I d={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>}/>,
  brain:<I d={<><path d="M12 5a3 3 0 1 0-5.9.6"/><path d="M12 5a3 3 0 1 1 5.9.6"/><path d="M7 9a3 3 0 0 0 0 6"/><path d="M17 9a3 3 0 0 1 0 6"/><path d="M9 18a3 3 0 0 0 6 0"/><path d="M12 5v13"/></>}/>,
  chart:<I d={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>}/>,
  bell:<I d={<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>}/>,
  test:<I d={<><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>}/>,
  task:<I d={<><path d="M9 11H3v10h6zM15 3H9v18h6zM21 7h-6v14h6z"/></>}/>,
  search:<I d={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} s={18}/>,
  send:<I d={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} s={18}/>,
  plus:<I d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} s={16}/>,
  mic:<I d={<><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></>} s={18}/>,
  star:<I d={<polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9"/>}/>,
  grad:<I d={<><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/></>}/>,
  shield:<I d={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>}/>,
  clip:<I d={<><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></>}/>,
  menu:<I d={<><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>}/>,
};

/* ================= LOGIN ================= */
function Login({onLogin}){
  const [tab,setTab]=useState('email');
  const [role,setRole]=useState('student');
  const roles=[['student','طالب',Ico.grad],['parent','ولي أمر',Ico.users],['teacher','معلم',Ico.book],
    ['supervisor','مشرف',Ico.shield],['super_admin','مدير',Ico.dash]];
  return(
   <div className="login">
    <div className="hero">
      <div className="blob" style={{width:260,height:260,top:-60,left:-40}}/>
      <div className="blob" style={{width:180,height:180,bottom:40,right:-30}}/>
      <div style={{display:'flex',alignItems:'center',gap:12,fontWeight:800,fontSize:26}}>
        <span className="logo" style={{width:46,height:46,fontSize:20}}>فـ</span> فطن</div>
      <h1>منصة تعليمية ذكية<br/>تبني المستقبل بالذكاء الاصطناعي</h1>
      <p>شرح تفاعلي، تحليل أداء لحظي، توصيات علاجية، وربط متكامل بين الطالب والمعلم وولي الأمر.</p>
      <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:380}}>
        <div className="feat">{Ico.brain} شرح الدروس وتوليد الأسئلة تلقائياً</div>
        <div className="feat">{Ico.chart} تحليل ذكي لمستوى الطالب وخطط تقوية</div>
        <div className="feat">{Ico.shield} نظام صلاحيات متقدم وحماية كاملة للبيانات</div>
      </div>
    </div>
    <div className="form">
      <div className="form-box">
        <h2>تسجيل الدخول</h2>
        <p className="sub">اختر نوع الحساب وسجّل الدخول للمتابعة</p>
        <div className="role-pick">
          {roles.map(([k,l,ic])=>(
            <button key={k} className={role===k?'on':''} onClick={()=>setRole(k)}>{ic}{l}</button>))}
        </div>
        <div className="tabs">
          <button className={tab==='email'?'on':''} onClick={()=>setTab('email')}>البريد الإلكتروني</button>
          <button className={tab==='phone'?'on':''} onClick={()=>setTab('phone')}>الجوال (OTP)</button>
        </div>
        {tab==='email'?(<>
          <div className="field"><label>البريد الإلكتروني</label><input placeholder="name@fatin.edu" defaultValue="demo@fatin.edu"/></div>
          <div className="field"><label>كلمة المرور</label><input type="password" defaultValue="123456"/></div>
        </>):(<>
          <div className="field"><label>رقم الجوال</label><input placeholder="05xxxxxxxx" defaultValue="0501234567"/></div>
          <div className="field"><label>رمز التحقق OTP</label><input placeholder="٤ أرقام" defaultValue="4821"/></div>
        </>)}
        <button className="btn" style={{width:'100%',justifyContent:'center',marginTop:6}}
          onClick={()=>onLogin(role)}>دخول إلى لوحة {roles.find(r=>r[0]===role)[1]}</button>
        <p className="soft" style={{textAlign:'center',marginTop:16,cursor:'pointer'}}>نسيت كلمة المرور؟</p>
      </div>
    </div>
   </div>);
}

/* ================ SHARED UI BITS ================ */
const KPI=({icon,val,lbl,chg,up,tint})=>(
  <div className="card kpi">
    <div className="row">
      <div className="ic" style={{background:tint[0],color:tint[1]}}>{icon}</div>
      {chg&&<span className={"chg "+(up?'up':'down')}>{up?'▲':'▼'} {chg}</span>}
    </div>
    <div className="val">{val}</div><div className="lbl">{lbl}</div>
  </div>);

const Bars=({data,alt})=>{
  const max=Math.max(...data.map(d=>d.v));
  return(<div className="bars">{data.map((d,i)=>(
    <div className="bar-col" key={i}>
      <div className={"bar"+(alt&&i%2?' alt':'')} style={{height:(d.v/max*100)+'%'}}/>
      <div className="bar-lbl">{d.l}</div>
    </div>))}</div>);
};

const Donut=({segs})=>{
  const tot=segs.reduce((a,b)=>a+b.v,0);let acc=0;const R=52,C=2*Math.PI*R;
  return(<div className="donut-wrap">
    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r={R} fill="none" stroke="var(--line)" strokeWidth="16"/>
      {segs.map((s,i)=>{const len=s.v/tot*C;const el=(
        <circle key={i} cx="65" cy="65" r={R} fill="none" stroke={s.c} strokeWidth="16"
          strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-acc} transform="rotate(-90 65 65)"
          strokeLinecap="round"/>);acc+=len;return el;})}
      <text x="65" y="60" textAnchor="middle" fontSize="22" fontWeight="800" fill="var(--ink)">{tot}</text>
      <text x="65" y="80" textAnchor="middle" fontSize="11" fill="var(--muted)">الإجمالي</text>
    </svg>
    <div className="legend">{segs.map((s,i)=>(
      <div className="li" key={i}><span className="sw" style={{background:s.c}}/>{s.l} — {s.v}</div>))}</div>
  </div>);
};

const PageHead=({title,sub,action})=>(
  <div className="page-head"><div><h1>{title}</h1><p>{sub}</p></div>{action}</div>);

/* ================ ADMIN DASHBOARD ================ */
function AdminDash(){
  return(<>
   <PageHead title="لوحة تحكم مدير النظام" sub="نظرة شاملة على أداء المنصة — مدرسة فطن النموذجية"
     action={<button className="btn">{Ico.plus} مستخدم جديد</button>}/>
   <div className="grid g4" style={{marginBottom:16}}>
     <KPI icon={Ico.grad} val="1,248" lbl="عدد الطلاب" chg="8%" up tint={['var(--primary-l)','var(--primary-d)']}/>
     <KPI icon={Ico.users} val="2,094" lbl="أولياء الأمور" chg="5%" up tint={['var(--accent-l)','var(--accent)']}/>
     <KPI icon={Ico.book} val="86" lbl="المعلمون" chg="2" up tint={['var(--ok-l)','var(--ok)']}/>
     <KPI icon={Ico.test} val="412" lbl="الاختبارات" chg="12%" up tint={['var(--warn-l)','var(--warn)']}/>
   </div>
   <div className="grid g4" style={{marginBottom:16}}>

/* ================ AI TUTOR CHAT ================ */
function Tutor(){
  const [msgs,setMsgs]=useState([
    {by:'bot',t:'أهلاً سارة! اكتب سؤالك أو ارفع صورة/ملف PDF وسأحلّه لك خطوة بخطوة.'},
    {by:'user',t:'كيف أحل: (-3) + (5) ؟'},
    {by:'bot',t:'بكل سرور 🌟\n١) لاحظي اختلاف الإشارتين (سالب وموجب).\n٢) اطرحي القيمة الأصغر من الأكبر: 5 − 3 = 2.\n٣) خذي إشارة العدد الأكبر (5 موجب) فالناتج = +2.\n\nسؤال مشابه للتدريب: ما ناتج (-8) + (6)؟'}]);
  const [v,setV]=useState('');
  const send=()=>{if(!v.trim())return;
    setMsgs(m=>[...m,{by:'user',t:v},{by:'bot',t:'ممتاز! دعيني أحلّها خطوة بخطوة وأعطيكِ مثالاً إضافياً وسؤالين مشابهين للتدريب... ✨'}]);setV('');};
  return(<>
   <PageHead title="المساعد الدراسي الذكي" sub="حل الأسئلة · شرح الخطوات · توليد أسئلة مشابهة"
     action={<span className="pill ai">{Ico.brain} GPT-4o</span>}/>
   <div className="card" style={{maxWidth:760,margin:'0 auto'}}>
     <div className="chat">
       {msgs.map((m,i)=>(<div key={i} className={"msg "+m.by} style={{whiteSpace:'pre-line'}}>{m.t}</div>))}
     </div>
     <div className="chat-input">
       <button className="icon-btn" title="رفع صورة/ملف">{Ico.plus}</button>
       <input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
         placeholder="اكتب سؤالك هنا..."/>
       <button className="btn" onClick={send}>{Ico.send} إرسال</button>
     </div>
   </div>
  </>);
}

const MENUS={
  super_admin:[['dash','الرئيسية',Ico.dash],['users','إدارة المستخدمين',Ico.users],['content','المحتوى التعليمي',Ico.book],['tests','الاختبارات',Ico.test],['reports','التقارير',Ico.chart],['notif','الإشعارات',Ico.bell]],
  supervisor:[['dash','الرئيسية',Ico.dash],['content','جودة المحتوى',Ico.book],['reports','التقارير',Ico.chart],['notif','الإشعارات',Ico.bell]],
  teacher:[['dash','الرئيسية',Ico.dash],['students','طلابي',Ico.grad],['content','دروسي',Ico.book],['tests','الاختبارات',Ico.test],['bank','بنك الأسئلة',Ico.brain]],
  parent:[['dash','أبنائي',Ico.users],['reports','التقارير الذكية',Ico.chart],['tasks','المهام المنزلية',Ico.task],['notif','الإشعارات',Ico.bell]],
  student:[['dash','مكتبتي',Ico.book],['lesson','الدرس الحالي',Ico.star],['tutor','المساعد الذكي',Ico.brain],['tests','اختباراتي',Ico.test],['tasks','واجباتي',Ico.task]],
};
const ROLE_AR={super_admin:'مدير النظام',supervisor:'مشرف تعليمي',teacher:'المعلم',parent:'ولي الأمر',student:'الطالب'};

function App(){
  const [role,setRole]=useState(null);
  const [view,setView]=useState('dash');
  const [open,setOpen]=useState(false);
  if(!role) return <Login onLogin={r=>{setRole(r);setView(r==='parent'?'dash':'dash');}}/>;
  const menu=MENUS[role];
  const go=v=>{setView(v);setOpen(false);};
  const render=()=>{
    if(role==='super_admin') return <AdminDash/>;
    if(role==='supervisor') return <SupervisorDash/>;
    if(role==='teacher') return <TeacherDash/>;
    if(role==='parent') return <ParentDash/>;
    if(role==='student'){
      if(view==='lesson') return <LessonView/>;
      if(view==='tutor') return <Tutor/>;
      return <StudentDash go={go}/>;
    }
  };
  return(
   <div className="app">
     <div className={"overlay"+(open?' show':'')} onClick={()=>setOpen(false)}/>
     <aside className={"sidebar"+(open?' open':'')}>
       <div className="brand"><span className="logo">فـ</span> فطن</div>
       <div className="nav-sep">القائمة</div>
       {menu.map(([k,l,ic])=>(
         <button key={k} className={"nav-item"+(view===k?' active':'')} onClick={()=>go(k)}>{ic}{l}</button>))}
       <div style={{marginTop:'auto'}}>
         <div className="nav-sep">الحساب</div>
         <button className="nav-item" onClick={()=>{setRole(null);setView('dash');}}>{Ico.shield} تسجيل الخروج</button>
       </div>
     </aside>
     <div className="main">
       <div className="topbar">
         <button className="icon-btn menu-btn" onClick={()=>setOpen(true)}>{Ico.menu}</button>
         <div className="search">{Ico.search}<input placeholder="ابحث عن درس، طالب، اختبار..."/></div>
         <div className="top-actions">
           <button className="icon-btn">{Ico.bell}<span className="badge-dot"/></button>
           <div style={{display:'flex',alignItems:'center',gap:10}}>
             <div className="avatar">{ROLE_AR[role][0]}</div>
             <div style={{lineHeight:1.3}}><div style={{fontWeight:700,fontSize:14}}>{ROLE_AR[role]}</div>
               <div className="soft" style={{fontSize:12}}>مدرسة فطن النموذجية</div></div>
           </div>
         </div>
       </div>
       <div className="content">{render()}</div>
     </div>
   </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
