          <div style={{textAlign:'center',padding:'8px 0'}}><div style={{fontSize:34,fontWeight:800,color:'var(--accent)'}}>{ar(Number(ach.exams_today))}</div><div className="soft">اختبار خلصته اليوم</div></div>
          <div style={{textAlign:'center',padding:'8px 0'}}><div style={{fontSize:34,fontWeight:800,color:'var(--warn)'}}>{ar(Number(ach.answered_today)?Math.round(Number(ach.correct_today)/Number(ach.answered_today)*100):0)}٪</div><div className="soft">دقتك اليوم</div></div>

        <div style={{marginTop:8,padding:'9px 13px',borderRadius:10,background:'var(--surface)',fontWeight:700,color:'var(--primary-d)',lineHeight:1.9}}>

  // ٣) المواد (حسب الصف والترم من ملف الطالب)

    <div className="grid g3">

      {courses.map(c=>(
        <div className="card lib-card" key={c.id} style={{cursor:'pointer',textAlign:'center',paddingTop:22}} onClick={()=>{setCourse(c);setMode(null);setExam(null);}}>

            fontSize:28,fontWeight:800,color:'#fff',background:'linear-gradient(135deg,var(--primary),var(--accent))'}}>{c.title[0]}</div>
          <div style={{fontWeight:800,fontSize:17}}>{c.title}</div>
        </div>))}

  // ٤) صفحة المادة: دروس أو اختبارات
  if(course&&!mode)return(<>
    {previewBar}
    <PageHead title={course.title} sub="اختر مسارك"
      action={<button className="btn ghost sm" onClick={()=>setCourse(null)}>→ المواد</button>}/>

        <div className="soft" style={{marginTop:4}}>افهم المادة بالشرح والتدريب</div></div>}
      <div className="card lib-card" style={{cursor:'pointer',textAlign:'center',padding:34}} onClick={()=>setMode('exams')}>
        <div style={{fontSize:42}}>📝</div><div style={{fontWeight:800,fontSize:21,marginTop:8}}>الاختبارات</div>
        <div className="soft" style={{marginTop:4}}>جهّز نفسك للاختبار</div></div>

  // ٥) قائمة الاختبارات الثلاثة
  if(mode==='exams'&&!exam)return(<>
    <PageHead title={"اختبارات "+course.title} sub={"الترم "+(term===1?'الأول':'الثاني')}
      action={<button className="btn ghost sm" onClick={()=>setMode(null)}>→ المادة</button>}/>
    <div className="grid g3">
      {[['period1','اختبار الفترة الأولى'],['period2','اختبار الفترة الثانية'],['final','الاختبار النهائي'],['central','الاختبار المركزي'],['practice','اختبار تدريبي 🧪']].map(([p,l])=>(
        <div className="card lib-card" key={p} style={{cursor:'pointer',textAlign:'center',padding:26}} onClick={()=>{setExam(p);setExamModel(null);}}>
          <div style={{fontSize:36}}>📝</div><div style={{fontWeight:800,fontSize:17,marginTop:8}}>{l}</div>
          <div className="soft" style={{marginTop:4}}>تدرّب وجهّز نفسك</div></div>))}
    </div>
  </>);

  // ٦) أداء الاختبار — تظهر كل النماذج ويُفتح كل نموذج كاملاً
  if(mode==='exams'&&exam)return(<>
    {previewBar}
    <PageHead title={examLabel(exam)+(examModel?(' — النموذج '+ar(examModel)):'')} sub={course.title}
      action={<button className="btn ghost sm" onClick={()=>{setExam(null);setExamModel(null);}}>→ الاختبارات</button>}/>
    {availModels.length>1&&(<div className="card" style={{marginBottom:14}}>
      <div className="card-title" style={{marginBottom:8}}>اختر النموذج ({ar(availModels.length)} نماذج)</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {availModels.map(m=>(<button key={m} onClick={()=>setExamModel(m)}
          style={{padding:'9px 16px',borderRadius:11,border:'1.5px solid '+(m===examModel?'var(--primary)':'var(--line)'),
            background:m===examModel?'var(--primary)':'var(--surface)',color:m===examModel?'#fff':'var(--ink)',
            fontFamily:'inherit',fontWeight:700,fontSize:14,cursor:'pointer'}}>النموذج {ar(m)}</button>))}
      </div>
    </div>)}
    {examModel
      ? <CourseExam key={exam+'-'+examModel} course={course} period={exam} model={examModel} onAnother={anotherModel} canAnother={availModels.length>1} gender={gen} allowExplain={explainOn} onGenerate={studentGenerate} canGenerate={explainOn} genBusy={genBusy}/>
      : <div className="card soft">جاري تجهيز نموذج الاختبار...</div>}
  </>);

  // ٧) قائمة الدروس
  if(mode==='lessons'&&!lesson)return(<>
    <PageHead title={course.title} sub="اختر درساً للبدء"
      action={<button className="btn ghost sm" onClick={()=>{stopSpeak();setMode(null);}}>→ المادة</button>}/>
    <div className="card">
      {lessons.length===0&&<div className="soft">لا توجد دروس بعد.</div>}
      {lessons.map((l,i)=>(
        <div className="list-row" key={l.id} style={{cursor:'pointer'}} onClick={()=>openLesson(l)}>
          <div className="roundico" style={{background:'var(--primary-l)',color:'var(--primary-d)',fontWeight:800}}>{i+1}</div>
          <div style={{flex:1,fontWeight:600}}>{l.title}</div>
          <span className="btn sm">ابدأ ←</span></div>))}
    </div>
  </>);

  // ٨) شاشة الدرس
  return(<>
    <PageHead title={lesson.title} sub={course.title}
      action={<button className="btn ghost sm" onClick={backToLessons}>→ الدروس</button>}/>
    {busy&&<div className="card" style={{fontWeight:600,color:'var(--primary-d)'}}>{busy}</div>}
    {variants&&(<>
      <div className="card" style={{marginBottom:18}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:16}}>
          {READ.map(([k,l])=>(<button key={k} className={readTab===k?'btn sm':'btn ghost sm'} onClick={()=>setReadTab(k)}>{l}</button>))}
          <button className="btn sm" style={{marginInlineStart:'auto',background:speaking?'var(--danger)':'var(--accent)'}}
            onClick={toggleAudio}>{speaking?'⏹ إيقاف':'🔊 استمع للشرح'}</button>
        </div>
        <div style={{padding:'4px 2px'}}>{readContent()}</div>
      </div>
      <div style={{textAlign:'center',marginBottom:18}}>
        <button className="btn" style={{background:'var(--warn)'}} disabled={extraBusy} onClick={doReexplain}>
          {extraBusy?'... جاري التبسيط':'🤔 ما فهمت؟ اشرح لي أكثر'}</button>
      </div>
      {extra&&(<div className="card" style={{marginBottom:18,background:'var(--warn-l)',whiteSpace:'pre-line',lineHeight:2.3,fontSize:16}}>
        <div style={{fontWeight:800,color:'var(--warn)',marginBottom:8}}>شرح إضافي مبسّط 🌱</div>{extra}</div>)}
      <div style={{fontWeight:800,fontSize:19,margin:'6px 4px 14px'}}>تدريب تفاعلي ✏️</div>
      <LessonQuiz lessonId={lesson.id} subject={course.title}/>
    </>)}
  </>);
}

function UsersAdmin({acct}){
  const sel={width:'100%',padding:'12px',borderRadius:11,border:'1px solid var(--line)',fontFamily:'inherit'};
  const ROLE_AR={super_admin:'مدير النظام',supervisor:'مشرف',teacher:'معلم',parent:'ولي أمر',student:'طالب'};
  const [list,setList]=useState([]);
  const [busy,setBusy]=useState('');const [err,setErr]=useState('');const [msg,setMsg]=useState('');
  const [f,setF]=useState({full_name:'',email:'',password:'',role:'student',grade:6,gender:'male',term:2});
  const load=async()=>{
    const{data}=await sb.from('accounts').select('id,full_name,role,email,created_at').order('created_at',{ascending:false});
    let rows=data||[];
    try{const{data:st}=await sb.rpc('org_users_status');const m={};(st||[]).forEach(x=>{m[x.id]=x;});
      rows=rows.map(r=>({...r,confirmed:m[r.id]?m[r.id].confirmed:undefined,last_sign_in:m[r.id]?m[r.id].last_sign_in:null}));}catch(e){}
    setList(rows);
  };
  const resetPass=async(u)=>{
    const def='Fatin@'+Math.floor(1000+Math.random()*9000);
    const p=window.prompt('كلمة مرور جديدة لـ '+(u.full_name||u.email||'المستخدم')+':',def);
    if(!p)return;
    setErr('');setMsg('');setBusy('جاري تعيين كلمة المرور...');

    setBusy('');
    if(error||(data&&data.error)){setErr('تعذّر تعيين كلمة المرور: '+((data&&data.error)||error.message));return;}
    setMsg('تم ✅ كلمة مرور '+(u.full_name||u.email)+' الجديدة: '+p+' (انسخيها وأرسليها له)');
  };
  useEffect(()=>{load();},[]);
  const create=async()=>{
    setErr('');setMsg('');
    if(!f.full_name.trim()||!f.email.trim()||!f.password){setErr('اكتب الاسم والبريد وكلمة المرور.');return;}
    if(f.password.length<6){setErr('كلمة المرور ٦ أحرف على الأقل.');return;}
    setBusy('جاري إنشاء الحساب...');
    const{data,error}=await sb.functions.invoke('admin-create-user',{body:f});
    setBusy('');
    if(error||(data&&data.error)){setErr('تعذّر: '+((data&&data.error)||error.message));return;}
    setMsg('تم إنشاء حساب «'+f.full_name+'» ✅');setF({...f,full_name:'',email:'',password:''});load();
  };
  // ربط ولي الأمر بالطالب
  const [links,setLinks]=useState([]);
  const [lk,setLk]=useState({parent:'',student:'',relation:'الأب'});
  const loadLinks=async()=>{const{data}=await sb.functions.invoke('admin-link-parent',{body:{action:'list'}});setLinks((data&&data.links)||[]);};
  useEffect(()=>{loadLinks();},[]);
  const parentsList=list.filter(u=>u.role==='parent');
  const studentsList=list.filter(u=>u.role==='student');
  const doLink=async()=>{
    setErr('');setMsg('');
    if(!lk.parent||!lk.student){setErr('اختر ولي الأمر والطالب.');return;}
    setBusy('جاري الربط...');
    const{data,error}=await sb.functions.invoke('admin-link-parent',{body:{action:'link',parent_account:lk.parent,student_account:lk.student,relation:lk.relation}});

         <div className="field"><label>الصف</label>
           <select value={f.grade} onChange={e=>setF({...f,grade:Number(e.target.value)})} style={sel}>

         <div className="field"><label>الجنس</label>
           <select value={f.gender} onChange={e=>setF({...f,gender:e.target.value})} style={sel}>

             <div className="field"><label>كلمة مرور جديدة (اختياري)</label><input value={newPass} onChange={e=>setNewPass(e.target.value)} placeholder="اتركه فارغاً لعدم التغيير"/></div>

// ===== الإشعارات (حقيقية حسب الدور) =====
function Notifications({role}){
  const [items,setItems]=useState(null);
  useEffect(()=>{(async()=>{
    try{
      if(role==='parent'){
        const{data}=await sb.functions.invoke('parent-children',{body:{}});
        const out=[];
        ((data&&data.children)||[]).forEach(c=>{
          const weak=c.subjects.filter(s=>s.accuracy<70).map(s=>s.subject);
          if(weak.length)out.push({t:'danger',title:c.name+' يحتاج تقوية في: '+weak.join('، '),sub:'بناءً على نتائج الاختبارات'});
          if(c.wrong>0)out.push({t:'warn',title:c.name+' عنده '+ar(c.wrong)+' أخطاء بحاجة مراجعة',sub:'افتح «أبنائي» لمتابعتها'});
          if(c.modelsSolved>0)out.push({t:'ok',title:c.name+' حلّ '+ar(c.modelsSolved)+' نموذج اختبار',sub:'الدقة '+ar(c.accuracy)+'٪'});
        });
        if(!out.length)out.push({t:'ok',title:'لا توجد تنبيهات جديدة',sub:'سيظهر هنا تقدّم أبنائك أولاً بأول'});
        setItems(out);
      }else{
        const{data}=await sb.from('accounts').select('full_name,role,created_at').order('created_at',{ascending:false}).limit(10);
        const rar={super_admin:'مدير نظام',supervisor:'مشرف',parent:'ولي أمر',student:'طالب',teacher:'معلم'};
        setItems((data||[]).map(a=>({t:'ok',title:'تسجيل جديد: '+(a.full_name||'—'),sub:(rar[a.role]||a.role)+' · '+new Date(a.created_at).toLocaleDateString('ar-SA')})));
      }
    }catch(e){setItems([{t:'warn',title:'تعذّر تحميل الإشعارات',sub:String(e)}]);}
  })();},[role]);
  const col={ok:'var(--ok)',warn:'var(--warn)',danger:'var(--danger)'};
  return(<>
   <PageHead title="الإشعارات" sub="آخر المستجدات والتنبيهات"/>
   <div className="card">
     {items===null&&<div className="soft">جارٍ التحميل...</div>}
     {items&&items.length===0&&<div className="soft">لا توجد إشعارات.</div>}
     {items&&items.map((n,i)=>(<div className="list-row" key={i}>
       <div className="roundico" style={{background:col[n.t]+'22',color:col[n.t]}}>{Ico.bell}</div>
       <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{n.title}</div><div className="soft" style={{fontSize:12}}>{n.sub}</div></div>
     </div>))}
   </div>
  </>);
}

// ===== التقارير (إحصاءات حقيقية + طباعة) =====
function Reports({counts,orgName}){
  const [d,setD]=useState(null);
  useEffect(()=>{(async()=>{
    try{
      const{data:accs}=await sb.from('accounts').select('role');
      const roleC={};(accs||[]).forEach(a=>{roleC[a.role]=(roleC[a.role]||0)+1;});
      const{data:cs}=await sb.from('courses').select('id');
      // إحصاء دقيق من الخادم (يتجاوز حد ١٠٠٠ صف)
      const{data:stats,error}=await sb.rpc('content_stats');
      if(error)throw error;
      const byC={};let totalQ=0;
      (stats||[]).forEach(r=>{const q=Number(r.questions);totalQ+=q;
        byC[r.course_id]=byC[r.course_id]||{title:r.title,grade:r.grade_level,term:r.term,total:0,p:{}};
        byC[r.course_id].total+=q;
        byC[r.course_id].p[r.exam_period]={q,m:Number(r.models)};});
      const courses=Object.values(byC).sort((a,b)=>(a.grade-b.grade)||a.title.localeCompare(b.title,'ar'));
      setD({roleC,courses,totalQ,courseCount:(cs||[]).length});
    }catch(e){setD({err:String(e)});}
  })();},[]);
  const cell=(p)=> p?(ar(p.q)+' سؤال · '+ar(p.m)+' نموذج'):'—';
  if(!d)return(<><PageHead title="التقارير" sub="نظرة شاملة على المنصة"/><div className="card soft">جارٍ التحميل...</div></>);
  if(d.err)return(<><PageHead title="التقارير"/><div className="card" style={{color:'var(--danger)'}}>{d.err}</div></>);
  return(<>
   <PageHead title="التقارير" sub={"نظرة شاملة — "+(orgName||'مدرسة فطن')}
     action={<button className="btn" onClick={()=>window.print()}>🖨️ طباعة</button>}/>
   <div className="grid g4" style={{marginBottom:18}}>
     <KPI icon={Ico.grad} val={ar(d.roleC.student||0)} lbl="الطلاب" tint={['var(--primary-l)','var(--primary-d)']}/>
     <KPI icon={Ico.users} val={ar(d.roleC.parent||0)} lbl="أولياء الأمور" tint={['var(--accent-l)','var(--accent)']}/>
     <KPI icon={Ico.book} val={ar(d.courseCount)} lbl="المواد" tint={['var(--ok-l)','var(--ok)']}/>
     <KPI icon={Ico.brain} val={ar(d.totalQ)} lbl="إجمالي الأسئلة" tint={['var(--warn-l)','var(--warn)']}/>
   </div>
   <div className="card" style={{overflowX:'auto'}}>
     <div className="card-title">المحتوى حسب المادة والترم والفترة</div>
     <table><thead><tr><th>المادة</th><th>الصف</th><th>الترم</th><th>الفترة الأولى</th><th>الفترة الثانية</th><th>النهائي</th><th>المركزي</th><th>تدريبي</th><th>الإجمالي</th></tr></thead>
     <tbody>
      {d.courses.map((c,i)=>(<tr key={i}>
        <td style={{fontWeight:600}}>{c.title}</td>
        <td className="soft">{gradeLabel(c.grade)}</td>
        <td className="soft">{c.term===1?'الأول':'الثاني'}</td>
        <td>{cell(c.p.period1)}</td><td>{cell(c.p.period2)}</td><td>{cell(c.p.final)}</td><td>{cell(c.p.central)}</td><td>{cell(c.p.practice)}</td>
        <td style={{fontWeight:800}}>{ar(c.total)}</td></tr>))}
      {d.courses.length===0&&<tr><td colSpan="9" className="soft">لا توجد أسئلة بعد.</td></tr>}
     </tbody></table>
   </div>
  </>);
}

// ===== إرفاق صور للأسئلة (للأسئلة المصوّرة مثل الإنجليزي) =====
function QuestionImages(){
  const [courses,setCourses]=useState([]);
  const [cid,setCid]=useState('');
  const [period,setPeriod]=useState('final');
  const [model,setModel]=useState(1);
  const [models,setModels]=useState([1]);
  const [rows,setRows]=useState(null);
  const [busy,setBusy]=useState('');
  const PERIODS=[['final','النهائي'],['central','المركزي'],['period1','الفترة الأولى'],['period2','الفترة الثانية'],['practice','تدريبي']];
  useEffect(()=>{(async()=>{const{data}=await sb.from('courses').select('id,title').order('title');setCourses(data||[]);if(data&&data[0])setCid(data[0].id);})();},[]);
  useEffect(()=>{(async()=>{if(!cid)return;const{data}=await sb.from('questions').select('model_no').eq('course_id',cid).eq('exam_period',period);
    const set=[...new Set((data||[]).map(r=>r.model_no||1))].sort((a,b)=>a-b);setModels(set.length?set:[1]);setModel(set.length?set[0]:1);})();},[cid,period]);
  const load=async()=>{if(!cid){setRows([]);return;}setRows(null);
    const{data}=await sb.from('questions').select('id,stem,image_url,q_type').eq('course_id',cid).eq('exam_period',period).eq('model_no',model).order('created_at');setRows(data||[]);};
  useEffect(()=>{if(cid)load();},[cid,period,model]);
  const toDataUrl=(file)=>new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{const max=700;const sc=Math.min(1,max/img.width);const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85));};img.onerror=rej;img.src=u;});
  const upload=async(q,file)=>{if(!file)return;setBusy(q.id);
    try{const url=await toDataUrl(file);const{error}=await sb.from('questions').update({image_url:url}).eq('id',q.id);
      if(error)alert('تعذّر الحفظ: '+error.message);else await load();}catch(e){alert('تعذّر رفع الصورة');}setBusy('');};
  const remove=async(q)=>{setBusy(q.id);await sb.from('questions').update({image_url:null}).eq('id',q.id);await load();setBusy('');};
  const [hints,setHints]=useState({});
  const genAI=async(q)=>{setBusy(q.id);
    try{const{data,error}=await sb.functions.invoke('generate-question-image',{body:{question_id:q.id,hint:(hints[q.id]||'').trim()}});
      if(error||(data&&data.error)){alert('تعذّر التوليد: '+((data&&data.error)||error.message));}else await load();}
    catch(e){alert('تعذّر التوليد');}setBusy('');};
  const selS={padding:'9px 11px',borderRadius:10,border:'1px solid var(--line)',fontFamily:'inherit'};
  return(<>
   <PageHead title="🖼️ إرفاق صور للأسئلة" sub="ارفعي صورة لكل سؤال يحتاج صورة (مثل أسئلة الإنجليزي المصوّرة) — تظهر للطالب مع السؤال"/>
   <div className="card" style={{marginBottom:14,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
     <select value={cid} onChange={e=>setCid(e.target.value)} style={{...selS,minWidth:220}}>{courses.map(c=><option key={c.id} value={c.id}>{c.title}</option>)}</select>
     <select value={period} onChange={e=>setPeriod(e.target.value)} style={selS}>{PERIODS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
     <select value={model} onChange={e=>setModel(Number(e.target.value))} style={selS}>{models.map(m=><option key={m} value={m}>النموذج {ar(m)}</option>)}</select>
   </div>
   <div className="card">
     {rows===null&&<div className="soft">جارٍ التحميل...</div>}
     {rows&&rows.length===0&&<div className="soft">لا توجد أسئلة في هذا النموذج.</div>}
     {rows&&rows.map((q,i)=>(<div key={q.id} style={{display:'flex',gap:12,alignItems:'center',padding:'12px 0',borderBottom:'1px solid var(--line)'}}>
       <div style={{flex:1}}>
         <div style={{fontWeight:600,fontSize:14}}>{ar(i+1)}. <MathText text={q.stem}/></div>
         {q.image_url&&<img src={q.image_url} alt="" style={{maxWidth:160,maxHeight:120,borderRadius:8,marginTop:6,border:'1px solid var(--line)'}}/>}
       </div>
       <div style={{display:'flex',flexDirection:'column',gap:6,minWidth:170}}>
         <input value={hints[q.id]||''} onChange={e=>setHints(h=>({...h,[q.id]:e.target.value}))} placeholder="وصف الصورة (مثل: life jacket)"

// ===== نشاط الطلاب (وقت الدخول والتدريب + تكلفة التوكنات) =====
function StudentActivity(){
  const [rows,setRows]=useState(null);
  const SAR=3.75; // تحويل الدولار إلى ريال تقريباً
  useEffect(()=>{(async()=>{
    const[a,c]=await Promise.all([sb.rpc('student_activity'),sb.rpc('student_costs')]);
    if(a.error){setRows([]);return;}
    const costBy={};(c.data||[]).forEach(x=>{costBy[x.student_id]=x;});
    const mx=(...ds)=>{const v=ds.filter(Boolean).map(d=>new Date(d).getTime());return v.length?Math.max(...v):0;};
    const out=(a.data||[]).map(r=>{const k=costBy[r.student_id]||{};return{...r,active:mx(r.last_login,r.last_answer,r.last_run),
      today_cost:Number(k.today_cost||0),total_cost:Number(k.total_cost||0),today_calls:Number(k.today_calls||0),total_calls:Number(k.total_calls||0)};})
      .sort((a,b)=>b.active-a.active);
    setRows(out);
  })();},[]);
  const fmt=(d)=> d?new Date(d).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'—';
  const since=(t)=>{if(!t)return '—';const m=Math.floor((Date.now()-t)/60000);
    if(m<1)return 'الآن';if(m<60)return 'قبل '+ar(m)+' د';const h=Math.floor(m/60);
    if(h<24)return 'قبل '+ar(h)+' س';const d=Math.floor(h/24);return 'قبل '+ar(d)+' يوم';};
  const sar=(usd)=>{const v=usd*SAR;return v<0.01&&v>0?ar(v.toFixed(3)):ar(v.toFixed(2));};
  if(!rows)return(<><PageHead title="نشاط الطلاب" sub="متابعة الدخول والتدريب"/><div className="card soft">جارٍ التحميل...</div></>);
  const sumToday=rows.reduce((s,r)=>s+r.today_cost,0);const sumTotal=rows.reduce((s,r)=>s+r.total_cost,0);
  return(<>
   <PageHead title="نشاط الطلاب والتكلفة" sub="متى دخل كل طالب ودرّب نفسه، وكم كلّف استخدامه للذكاء الاصطناعي"
     action={<button className="btn ghost" onClick={()=>window.print()}>🖨️ طباعة</button>}/>
   <div className="grid g2" style={{marginBottom:16}}>
     <KPI icon={Ico.chart} val={sar(sumToday)+' ر.س'} lbl="إجمالي تكلفة اليوم (كل الطلاب)" tint={['var(--warn-l)','var(--warn)']}/>
     <KPI icon={Ico.star} val={sar(sumTotal)+' ر.س'} lbl="إجمالي التكلفة الكلية" tint={['var(--primary-l)','var(--primary-d)']}/>
   </div>
   <div className="card" style={{overflowX:'auto'}}>
     {rows.length===0&&<div className="soft">لا يوجد طلاب بعد.</div>}
     {rows.length>0&&<table>
       <thead><tr><th>الطالب</th><th>الصف</th><th>آخر دخول</th><th>منذ</th><th>أسئلة حلّها</th><th>نماذج</th><th>تكلفة اليوم</th><th>التكلفة الكلية</th></tr></thead>
       <tbody>
        {rows.map((r,i)=>{return(<tr key={i}>
          <td style={{fontWeight:600}}>{r.name||'—'}</td>
          <td className="soft">{gradeLabel(r.grade)}</td>
          <td className="soft">{fmt(r.last_login)}</td>
          <td><span className="tag" style={{background:r.active&&(Date.now()-r.active<86400000)?'var(--ok-l)':'var(--line)',color:r.active&&(Date.now()-r.active<86400000)?'var(--ok)':'var(--muted)'}}>{since(r.active)}</span></td>
          <td>{ar(r.answered||0)}</td><td>{ar(r.exams||0)}</td>
          <td style={{fontWeight:700,color:r.today_cost>0?'var(--warn)':'var(--muted)'}}>{sar(r.today_cost)} ر.س</td>
          <td style={{fontWeight:700}}>{sar(r.total_cost)} ر.س</td></tr>);})}
       </tbody></table>}
     <div className="soft" style={{fontSize:12,marginTop:10,lineHeight:1.8}}>التكلفة تقديرية محسوبة من توكنات الذكاء الاصطناعي التي استهلكها الطالب (شرح «ارجع افهم» وتوليد الأسئلة التدريبية)، بأسعار OpenAI وبتحويل تقريبي للدولار ١ $ ≈ ٣٫٧٥ ر.س.</div>
   </div>
  </>);
}

     <div className="card-title">🤖 ميزات الذكاء الاصطناعي</div>

function App(){
  const [acct,setAcct]=useState(null);     // {role, full_name, org_id, org_name}
  const [counts,setCounts]=useState(null);
  const [view,setView]=useState('dash');
  const [open,setOpen]=useState(false);
  const [loading,setLoading]=useState(true);
  const [newReports,setNewReports]=useState(0);
  useEffect(()=>{(async()=>{
    if(!acct||!(acct.role==='super_admin'||acct.role==='supervisor'))return;
    try{const{count}=await sb.from('question_reports').select('*',{count:'exact',head:true}).eq('status','new');setNewReports(count||0);}catch(e){}
  })();},[acct,view]);

  const loadCounts=async(orgId)=>{
    const tabs=['students','parents','courses','lessons','assessments'];
    const out={};
    await Promise.all(tabs.map(async t=>{
      const {count}=await sb.from(t).select('*',{count:'exact',head:true});
      out[t]=count??0;
    }));
    setCounts(out);
  };
  const loadSession=async()=>{
    if(!CONFIGURED){setLoading(false);return;}
    // قادم من الصفحة الرئيسية بطلب دخول/تسجيل جديد → اعرض شاشة الدخول دائماً
    try{
      const p=new URLSearchParams(location.search);
      if(p.get('login')!=null||p.get('signup')!=null){
        window.__fatinSignup=(p.get('signup')!=null);
        if(sb)await sb.auth.signOut();CURRENT_UID=null;
        history.replaceState({},'',location.pathname);
        setAcct(null);setLoading(false);return;
      }
    }catch(e){}
    const {data:{session}}=await sb.auth.getSession();
    if(!session){CURRENT_UID=null;setAcct(null);setLoading(false);return;}
    CURRENT_UID=session.user.id;
    const {data:acc}=await sb.from('accounts')
      .select('role, full_name, org_id, organizations(name)').eq('id',session.user.id).single();
    if(!acc){setAcct({id:session.user.id,role:'student',full_name:'',email:session.user.email});setLoading(false);return;}
    const a={id:session.user.id,role:acc.role,full_name:acc.full_name,org_id:acc.org_id,org_name:acc.organizations?.name};
    setAcct(a);setLoading(false);
    try{sb.from('accounts').update({last_login_at:new Date().toISOString()}).eq('id',session.user.id).then(()=>{});}catch(e){}
    if(a.role==='super_admin'||a.role==='supervisor') loadCounts(a.org_id);
  };
  useEffect(()=>{loadSession();},[]);
  const logout=async()=>{if(sb)await sb.auth.signOut();setAcct(null);setCounts(null);setView('dash');};

  if(loading) return <div style={{height:'100vh',display:'grid',placeItems:'center',color:'var(--muted)',fontWeight:600}}>جارٍ التحميل...</div>;
  if(!acct) return <Login onAuthed={()=>{setLoading(true);loadSession();}} startSignup={!!window.__fatinSignup}/>;
  if(!acct.role) return (
    <div style={{height:'100vh',display:'grid',placeItems:'center',padding:24}}>
      <div className="card" style={{maxWidth:460,textAlign:'center'}}>
        <h2 style={{marginBottom:10}}>حسابك بلا صلاحية بعد</h2>
        <p className="soft" style={{lineHeight:2,marginBottom:16}}>سجّلت الدخول بنجاح ({acct.email})، لكن لا يوجد صف مرتبط في جدول accounts. أضف صفاً في accounts بنفس معرّف المستخدم ودوره، ثم أعد الدخول.</p>
        <button className="btn" style={{margin:'0 auto'}} onClick={logout}>{Ico.shield} تسجيل الخروج</button>
      </div>
    </div>);

  const role=acct.role;
  const menu=MENUS[role]||MENUS.student;
  const go=v=>{setView(v);setOpen(false);};
  const render=()=>{
    if(view==='users'&&(role==='super_admin'||role==='supervisor'))
      return <UsersAdmin acct={acct}/>;
    if(view==='content'&&(role==='super_admin'||role==='supervisor'))
      return <Library acct={acct}/>;
    if(view==='student_preview'&&(role==='super_admin'||role==='supervisor'))
      return <StudentExperience acct={acct} nav="dash" preview={true}/>;
    if(view==='notif'&&role!=='student') return <Notifications role={role}/>;
    if(view==='reports'&&(role==='super_admin'||role==='supervisor'))
      return <Reports counts={counts} orgName={acct.org_name}/>;
    if(view==='settings'&&(role==='super_admin'||role==='supervisor'))
      return <Settings/>;
    if(view==='activity'&&(role==='super_admin'||role==='supervisor'))
      return <StudentActivity/>;
    if(view==='leaderboard'&&(role==='super_admin'||role==='supervisor'))
      return <Leaderboard adminMode={true}/>;
    if(view==='reports_q'&&(role==='super_admin'||role==='supervisor'))
      return <QuestionReports/>;
    if(view==='qimages'&&(role==='super_admin'||role==='supervisor'))
      return <QuestionImages/>;
    if(view==='writing_admin'&&(role==='super_admin'||role==='supervisor'))
      return <WritingTopics/>;
    if(role==='student') return <StudentExperience acct={acct} nav={view}/>;
    if(role==='super_admin'||role==='supervisor') return <AdminDash counts={counts} orgName={acct.org_name}/>;
    if(role==='parent') return <ParentDash/>;
    if(role==='student'){
      if(view==='lesson') return <LessonView/>;
      if(view==='tutor') return <Tutor/>;
      return <StudentDash go={go}/>;
    }
  };
  return(
   <div className="app">
     <div className={"overlay"+(open?' show':'')} onClick={()=>setOpen(false)}/>
     <aside className={"sidebar"+(open?' open':'')}>
       <div className="brand"><span className="logo">فـ</span> فطن</div>
       <div className="nav-sep">القائمة</div>
       {menu.map(([k,l,ic])=>(
         <button key={k} className={"nav-item"+(view===k?' active':'')} onClick={()=>go(k)} style={{display:'flex',alignItems:'center',gap:8}}>
           {ic}<span>{l}</span>
           {k==='reports_q'&&newReports>0&&<span style={{marginInlineStart:'auto',background:'var(--danger)',color:'#fff',borderRadius:999,minWidth:20,height:20,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,padding:'0 6px'}}>{ar(newReports)}</span>}
         </button>))}
       <div style={{marginTop:'auto'}}>
         <div className="nav-sep">الحساب</div>
         <button className="nav-item" onClick={logout}>{Ico.shield} تسجيل الخروج</button>
       </div>
     </aside>
     <div className="main">
       <div className="topbar">
         <button className="icon-btn menu-btn" onClick={()=>setOpen(true)}>{Ico.menu}</button>
         <div className="search">{Ico.search}<input placeholder="ابحث عن درس، طالب، اختبار..."/></div>
         <div className="top-actions">
           <button className="icon-btn">{Ico.bell}<span className="badge-dot"/></button>
           <div style={{display:'flex',alignItems:'center',gap:10}}>
             <div className="avatar">{(acct.full_name||ROLE_AR[role])[0]}</div>
             <div style={{lineHeight:1.3}}><div style={{fontWeight:700,fontSize:14}}>{acct.full_name||ROLE_AR[role]}</div>
               <div className="soft" style={{fontSize:12}}>{ROLE_AR[role]} · {acct.org_name||'مدرسة فطن'}</div></div>
           </div>
         </div>
       </div>
       <div className="content">{render()}</div>
     </div>
   </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
